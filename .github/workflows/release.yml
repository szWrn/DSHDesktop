name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_args: --target universal-apple-darwin
            artifact: macos
          - platform: ubuntu-22.04
            rust_targets: ''
            build_args: ''
            artifact: linux
          - platform: windows-latest
            rust_targets: ''
            build_args: --no-bundle
            artifact: windows

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build ${{ matrix.build_args }}

      - name: Install Inno Setup
        if: matrix.platform == 'windows-latest'
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer (Inno Setup)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'iss\Setup.iss'

      - name: Collect macOS artifact
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          mkdir -p release
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release/

      - name: Collect Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/deb/*.deb release/
          cp src-tauri/target/release/bundle/rpm/*.rpm release/
          cp src-tauri/target/release/bundle/appimage/*.AppImage release/

      - name: Collect Windows artifact
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p release
          cp src-tauri/target/release/installer/*.exe release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.artifact }}
          path: release/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release/*
